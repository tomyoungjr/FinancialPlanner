# Your view of the world. This file is the point of the whole planner.
#
# A standard planner assumes ONE set of market statistics that holds for
# decades ("linear_baseline" below). This planner also runs a nonlinear world:
#   1. Regimes: the economy moves between very different operating models,
#      each with its own returns, inflation, and stock/bond correlation.
#   2. Disruptions: one-time structural changes (policy, technology) that
#      permanently change the rules from the year they happen.
#
# Every probability below is a judgment call, not a forecast. Write in YOUR estimates.

simulation:
  paths: 5000
  seed: 42

# ---------------------------------------------------------------------------
# The "linear" world a typical planner assumes: one set of statistics forever.
# Annual nominal returns. mean = average, vol = standard deviation.
# ---------------------------------------------------------------------------
linear_baseline:
  inflation:   {mean: 0.025, vol: 0.010}
  equities:    {mean: 0.090, vol: 0.170}
  bonds:       {mean: 0.045, vol: 0.060}
  real_assets: {mean: 0.050, vol: 0.100}
  cash:        {mean: 0.030, vol: 0.010}
  correlations: {equities|bonds: 0.0}

# ---------------------------------------------------------------------------
# Regimes. The economy sits in one regime per year and switches according to
# the transition table (each row = probabilities of next year's regime).
#
# Calibrated so the LONG-RUN AVERAGE roughly matches the linear baseline
# (the app shows this in the Regimes tab). That keeps the comparison fair:
# any difference comes from the path, not from being more pessimistic.
# ---------------------------------------------------------------------------
regimes:
  start: steady
  states:
    steady:
      label: Steady growth (the world planners assume)
      inflation:   {mean: 0.025, vol: 0.010}
      equities:    {mean: 0.110, vol: 0.150}
      bonds:       {mean: 0.050, vol: 0.050}
      real_assets: {mean: 0.045, vol: 0.080}
      cash:        {mean: 0.030, vol: 0.008}
      correlations: {equities|bonds: -0.2}
    inflationary:
      label: Fiscal dominance / stagflation (think 1970s)
      inflation:   {mean: 0.065, vol: 0.025}
      equities:    {mean: 0.050, vol: 0.200}
      bonds:       {mean: 0.010, vol: 0.090}
      real_assets: {mean: 0.090, vol: 0.140}
      cash:        {mean: 0.055, vol: 0.015}
      correlations: {equities|bonds: 0.5}   # stocks and bonds fall together; 60/40 stops diversifying
    bust:
      label: Deflationary bust (think 2008 or Japan)
      inflation:   {mean: 0.000, vol: 0.015}
      equities:    {mean: -0.040, vol: 0.250}
      bonds:       {mean: 0.075, vol: 0.080}
      real_assets: {mean: -0.020, vol: 0.120}
      cash:        {mean: 0.010, vol: 0.005}
      correlations: {equities|bonds: -0.4}
    ai_boom:
      label: AI productivity boom (strong growth, falling costs)
      inflation:   {mean: 0.015, vol: 0.010}
      equities:    {mean: 0.160, vol: 0.190}
      bonds:       {mean: 0.045, vol: 0.050}
      real_assets: {mean: 0.030, vol: 0.080}
      cash:        {mean: 0.030, vol: 0.008}
      correlations: {equities|bonds: -0.1}
  transitions:   # from -> to. Each row must sum to 1.
    steady:       {steady: 0.80, inflationary: 0.08, bust: 0.07, ai_boom: 0.05}
    inflationary: {steady: 0.20, inflationary: 0.70, bust: 0.07, ai_boom: 0.03}
    bust:         {steady: 0.35, inflationary: 0.10, bust: 0.50, ai_boom: 0.05}
    ai_boom:      {steady: 0.15, inflationary: 0.08, bust: 0.07, ai_boom: 0.70}

# ---------------------------------------------------------------------------
# Disruptions: structural changes that may or may not happen.
#
#   probability : your odds it happens at some point inside `window` (calendar years)
#   boosted_by  : cascades. If another disruption already happened, multiply the
#                 yearly odds of this one (e.g. AI job loss makes UBI more likely).
#   effects     : what changes, permanently, from the year it happens:
#     ss_multiplier           Social Security benefit x this
#     ss_means_test           {asset_threshold, reduction}: cut benefit if your
#                             real portfolio is above the threshold
#     healthcare_multiplier   healthcare cost x this
#     tax_rate_delta          added to your effective tax rate
#     extra_income            new real income per year (e.g. UBI)
#     earned_income_multiplier  salary x this while still working
#     spending_multiplier     all living costs x this
#     inflation_delta         added to inflation every year after
#     equity_return_delta     added to equity returns every year after
#     regime_tilt             {regime: x} makes switching into that regime x times as likely
#     force_regime            {regime, years}: jolts the economy into a regime
#     plan_extension_years    you live longer; the plan must last longer
# ---------------------------------------------------------------------------
disruptions:
  ss_across_the_board_cut:
    label: Social Security across-the-board cut
    note: >-
      Trustees project the retirement trust fund runs dry in the early-to-mid 2030s,
      after which only ~77-81% of scheduled benefits are payable unless Congress acts.
      Check the latest Trustees Report and set your odds that Congress does NOT fix it in time.
    probability: 0.50
    window: [2032, 2036]
    boosted_by: {fiscal_debt_crisis: 2.0}
    effects: {ss_multiplier: 0.80}

  ss_means_testing:
    label: Social Security means testing
    note: Benefits reduced for households with substantial assets.
    probability: 0.30
    window: [2030, 2045]
    boosted_by: {fiscal_debt_crisis: 1.5, ubi: 2.0}
    effects:
      ss_means_test: {asset_threshold: 1500000, reduction: 0.50}

  universal_healthcare:
    label: Universal healthcare
    note: Out-of-pocket healthcare falls sharply, paid for with higher taxes.
    probability: 0.20
    window: [2029, 2045]
    boosted_by: {ai_labor_displacement: 1.5}
    effects: {healthcare_multiplier: 0.40, tax_rate_delta: 0.04}

  ai_labor_displacement:
    label: AI displaces white-collar work
    note: >-
      Earnings drop for anyone still working; markets become more bimodal
      (boom for capital owners, or a demand-driven bust).
    probability: 0.40
    window: [2027, 2035]
    effects:
      earned_income_multiplier: 0.50
      regime_tilt: {ai_boom: 1.8, bust: 1.3}

  ubi:
    label: Universal basic income
    note: New income for everyone, funded by taxes and some inflation.
    probability: 0.15
    window: [2030, 2045]
    boosted_by: {ai_labor_displacement: 3.0}
    effects: {extra_income: 12000, tax_rate_delta: 0.03, inflation_delta: 0.005}

  fiscal_debt_crisis:
    label: US fiscal / debt crisis
    note: Bond market forces a reckoning; inflation used to erode debt.
    probability: 0.20
    window: [2027, 2040]
    effects:
      force_regime: {regime: inflationary, years: 3}
      tax_rate_delta: 0.02
      regime_tilt: {inflationary: 1.5}

  higher_capital_taxes:
    label: Higher taxes on capital / wealth
    note: Higher rates on investment income, withdrawals, or wealth.
    probability: 0.25
    window: [2027, 2040]
    boosted_by: {ubi: 2.0, fiscal_debt_crisis: 2.0}
    effects: {tax_rate_delta: 0.05}

  longevity_breakthrough:
    label: Longevity breakthrough (AI-driven medicine)
    note: Good news that is a financial risk - the money has to last longer.
    probability: 0.10
    window: [2030, 2050]
    boosted_by: {ai_labor_displacement: 1.5}
    effects: {plan_extension_years: 8}
